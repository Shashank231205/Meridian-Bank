name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Lint
        run: ruff check src tests

      # Network tests are excluded: CI must not depend on third-party public
      # APIs being up, and the pipeline is designed to run offline from cache.
      - name: Test
        run: python -m pytest tests -v -m "not network"

  secrets:
    name: secret sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert no .env or key material is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|credentials\.json$'; then
            echo "::error::secret-bearing file is tracked by git"
            exit 1
          fi
          echo "no tracked secret files"
