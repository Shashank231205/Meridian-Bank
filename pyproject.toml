[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Meridian Bank - customer intelligence and decision analytics platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shashank" }]
dependencies = ["pandas>=2.0,<3.0", "numpy>=1.24,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "network: test performs a live network call (deselect with -m 'not network')",
  "slow: test takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]  # long lines in docstrings/tables are deliberate

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are the point
